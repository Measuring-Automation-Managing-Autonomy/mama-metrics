name: validate-metric-cards

on:
  push:
    branches: [main]
    paths: ["cards/**", "schema/**", "tools/**", ".github/workflows/validate.yml"]
  pull_request:
    paths: ["cards/**", "schema/**", "tools/**", ".github/workflows/validate.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema
      - name: Validate metric cards
        run: python tools/validate_cards.py
