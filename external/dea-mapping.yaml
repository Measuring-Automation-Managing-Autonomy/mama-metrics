    change: Initial crosswalk (15 rows) pinned to catalog commit c2a2951a8a4f437817e293cd12593b4e70176f4d; upstream back-references seeded via CR-MET-021.
  - date: "2026-11-04"
    change: Re-pinned to 7a2796ff49ae93fcb6f333e5f45bc9a4a063b7eb — CR-MET-021 merged (PR #14); upstream external_references back-references now live on all 12 mapped records.
  - date: "2026-11-04"
    change: Re-pinned to b74f29ad5e59945aaacff43d2ea5cd477fc75b49 — CR-MET-022 merged (PR #15); the 3 proposes_upstream rows flipped to mapped (automation-eligibility-share → dea:metric-automation-eligibility-share; worker-experience-impact → dea:metric-automation-oversight-burden; distributional-effects → dea:metric-outcome-disparity-ratio). All 15 rows now mapped.
